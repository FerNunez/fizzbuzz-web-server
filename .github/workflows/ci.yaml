name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check dependencies diff
        run: make tidy
      - name: Check formatting
        run: make fmt
      - name: Go vet
        run: make vet
      - name: Build
        run: make build

  test: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: make race
    
  docker:
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build -t fizzbuzz-web-server:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name app -p 8081:8081 fizzbuzz-web-server:ci
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused localhost:8081/health
      - name: Logs on failure
        if: failure()
        run: docker logs app
